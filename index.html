<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子星云 · 纯原生Canvas</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #04040c;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
  .title {
    position: fixed;
    bottom: 40px; left: 0; width: 100%;
    text-align: center;
    color: rgba(150, 200, 255, 0.5);
    font-size: 13px;
    letter-spacing: 10px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 10;
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.3; letter-spacing: 8px; }
    50%      { opacity: 0.9; letter-spacing: 14px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="title">✦ 粒 子 星 云 ✦</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let mouse = { x: -9999, y: -9999, active: false };
  let tick = 0;

  /* ---------- 尺寸自适应 ---------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildParticles();
  }

  /* ---------- 构建粒子 ---------- */
  function buildParticles() {
    // 粒子总数根据屏幕面积调整，保证性能和密度平衡
    const count = Math.min(450, Math.floor((W * H) / 3200));
    particles = [];

    for (let i = 0; i < count; i++) {
      // 每层粒子：0=远景小粒子，1=中景，2=近景大粒子
      const layer = Math.random() < 0.55 ? 0 : (Math.random() < 0.7 ? 1 : 2);

      const baseRadius   = layer === 0 ? 0.6 + Math.random() * 0.8
                         : layer === 1 ? 1.2 + Math.random() * 1.4
                         : 2.0 + Math.random() * 1.8;

      // 色相：蓝(200)~紫(280)~青(180) 之间流动
      const hue = 185 + Math.random() * 95;

      particles.push({
        x: Math.random() * W,
        y: Math.random() * H,
        // 速度：远景慢，近景稍快，制造视差
        vx: (Math.random() - 0.5) * (layer === 2 ? 0.55 : layer === 1 ? 0.35 : 0.2),
        vy: (Math.random() - 0.5) * (layer === 2 ? 0.55 : layer === 1 ? 0.35 : 0.2),
        baseX: 0, baseY: 0,        // 预留
        radius: baseRadius,
        baseRadius: baseRadius,
        hue: hue,
        layer: layer,
        // 每个粒子独立的呼吸相位
        phase: Math.random() * Math.PI * 2,
        phaseSpeed: 0.015 + Math.random() * 0.02,
        // 发光强度
        glow: 0.6 + Math.random() * 0.4,
        // 用于鼠标斥力的偏移量（让交互更柔和）
        ox: 0, oy: 0
      });
    }
  }

  /* ---------- 绘制单帧 ---------- */
  function draw() {
    tick += 1;

    // 背景：用半透明黑色覆盖实现拖尾，但保留一丝色彩余韵
    ctx.fillStyle = 'rgba(4, 4, 12, 0.22)';
    ctx.fillRect(0, 0, W, H);

    // 1) 先画粒子之间的连线（星云网状结构），只在中近景粒子之间连接
    //    为了性能，只遍历一部分粒子对
    const linkDist = 110;
    const linkDistSq = linkDist * linkDist;

    for (let i = 0; i < particles.length; i++) {
      const p1 = particles[i];
      if (p1.layer === 0) continue; // 远景不连线

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        if (p2.layer === 0) continue;

        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        const dSq = dx * dx + dy * dy;

        if (dSq < linkDistSq) {
          const d = Math.sqrt(dSq);
          // 透明度随距离衰减
          const alpha = (1 - d / linkDist) * 0.28;
          // 颜色混合：两个粒子的平均色相
          const hue = (p1.hue + p2.hue) / 2;
          ctx.strokeStyle = `hsla(${hue}, 85%, 65%, ${alpha})`;
          ctx.lineWidth = p1.layer === 2 && p2.layer === 2 ? 0.9 : 0.5;
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }
    }

    // 2) 绘制所有粒子
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // ---- 物理运动 ----
      // 鼠标引力交互：粒子向鼠标方向轻微加速
      if (mouse.active) {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const distSq = dx * dx + dy * dy;
        const R = 200;
        if (distSq < R * R) {
          const dist = Math.sqrt(distSq) || 1;
          const force = (1 - dist / R) * 0.06;
          // 不同层级反应不同：近景反应更强
          const strength = p.layer === 2 ? 1.4 : p.layer === 1 ? 1.0 : 0.5;
          p.vx += (dx / dist) * force * strength;
          p.vy += (dy / dist) * force * strength;
        }
      }

      // 阻尼
      p.vx *= 0.985;
      p.vy *= 0.985;

      // 保持最低速度（自然漂移）
      const minSpd = 0.05;
      if (Math.abs(p.vx) < minSpd) p.vx += (Math.random() - 0.5) * 0.02;
      if (Math.abs(p.vy) < minSpd) p.vy += (Math.random() - 0.5) * 0.02;

      // 限制最大速度
      const maxSpd = 1.6;
      const spd = Math.hypot(p.vx, p.vy);
      if (spd > maxSpd) {
        p.vx = (p.vx / spd) * maxSpd;
        p.vy = (p.vy / spd) * maxSpd;
      }

      p.x += p.vx;
      p.y += p.vy;

      // 边界环绕
      if (p.x < -30) p.x = W + 30;
      if (p.x > W + 30) p.x = -30;
      if (p.y < -30) p.y = H + 30;
      if (p.y > H + 30) p.y = -30;

      // ---- 呼吸效果：半径随时间微变 ----
      p.phase += p.phaseSpeed;
      const breath = 1 + Math.sin(p.phase) * 0.35;
      const r = p.baseRadius * breath;

      // ---- 色相缓慢流动 ----
      p.hue += 0.08;
      if (p.hue > 285) p.hue = 185;

      // ---- 绘制光晕 ----
      const cx = p.x;
      const cy = p.y;
      const hue = p.hue;

      // 大范围光晕（径向渐变）
      const glowR = r * (p.layer === 2 ? 6 : p.layer === 1 ? 4.5 : 3.5);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
      grad.addColorStop(0,   `hsla(${hue}, 100%, 85%, ${0.9 * p.glow})`);
      grad.addColorStop(0.25,`hsla(${hue}, 95%, 70%, ${0.5 * p.glow})`);
      grad.addColorStop(0.6, `hsla(${hue}, 90%, 55%, ${0.15 * p.glow})`);
      grad.addColorStop(1,   `hsla(${hue}, 90%, 50%, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
      ctx.fill();

      // 中心亮核
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 100%, 92%, ${0.95 * p.glow})`;
      ctx.fill();

      // 近景粒子额外加一个亮白核心
      if (p.layer === 2) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${0.9 * p.glow})`;
        ctx.fill();
      }
    }
  }

  /* ---------- 动画循环 ---------- */
  let running = true;
  function loop() {
    if (!running) return;
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- 事件绑定 ---------- */
  window.addEventListener('resize', () => {
    resize();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  });

  window.addEventListener('mouseleave', () => {
    mouse.active = false;
    mouse.x = -9999;
    mouse.y = -9999;
  });

  // 触摸支持
  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      mouse.active = true;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.active = false;
  });

  // 页面不可见时暂停（性能优化）
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      running = false;
    } else {
      running = true;
      loop();
    }
  });

  /* ---------- 启动 ---------- */
  resize();
  loop();

})();
</script>
</body>
</html>
